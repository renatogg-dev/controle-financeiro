{% extends "base.html" %}
{% block title %}Lembretes · Controle Financeiro{% endblock %}
{% block content %}
<h1 class="font-display text-2xl text-ink-900 mb-6">Lembretes</h1>
<div class="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-6 items-start">
    <div class="rounded-xl border border-surface-border bg-white p-5">
        <h2 class="font-display text-xl text-ink-900 mb-4">Nova conta</h2>
        <form
            class="space-y-4"
            hx-post="/app/reminders"
            hx-target="#reminder-list-container"
            hx-swap="outerHTML"
            hx-on::after-request="if(event.detail.successful) this.reset()"
        >
            <div>
                <label for="name" class="block text-sm font-medium text-ink-700 mb-1">Conta</label>
                <input type="text" id="name" name="name" required maxlength="100" placeholder="Ex: Luz"
                    class="w-full rounded-md border border-surface-border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ink-900">
            </div>
            <div>
                <label for="amount" class="block text-sm font-medium text-ink-700 mb-1">Valor (R$)</label>
                <input type="number" id="amount" name="amount" min="0" step="0.01"
                    class="w-full rounded-md border border-surface-border px-3 py-2 text-sm tabular-nums focus:outline-none focus:ring-2 focus:ring-ink-900">
            </div>
            <div>
                <label for="due_date" class="block text-sm font-medium text-ink-700 mb-1">Vencimento</label>
                <input type="date" id="due_date" name="due_date" required
                    class="w-full rounded-md border border-surface-border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ink-900">
            </div>
            <div>
                <label for="notes" class="block text-sm font-medium text-ink-700 mb-1">Observações</label>
                <input type="text" id="notes" name="notes" maxlength="200" placeholder="Ex: pagar via Pix"
                    class="w-full rounded-md border border-surface-border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ink-900">
            </div>
            <button type="submit" class="w-full rounded-md bg-ink-900 px-3 py-2.5 text-sm font-medium text-white hover:bg-ink-800 transition-colors">
                Salvar lembrete
            </button>
        </form>
    </div>
    {% include "reminders/_list.html" %}
</div>
{% endblock %}
