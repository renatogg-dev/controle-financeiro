{% extends "base.html" %}
{% block title %}Criar conta · Controle Financeiro{% endblock %}
{% block body %}
<div class="flex min-h-full items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">
        <h1 class="font-display text-3xl text-ink-900 mb-1 text-center">Controle Financeiro</h1>
        <p class="text-ink-500 text-sm mb-8 text-center">Crie sua conta gratuita.</p>

        <div class="rounded-xl border border-surface-border bg-white px-6 py-7">
            {% if error %}
            <p class="mb-4 rounded-md bg-expense-soft px-3 py-2 text-sm text-expense">{{ error }}</p>
            {% endif %}
            <form method="post" action="/register" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-ink-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required autofocus
                        class="w-full rounded-md border border-surface-border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ink-900"
                        placeholder="seu@email.com" value="{{ email or '' }}">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-ink-700 mb-1">Senha</label>
                    <input type="password" id="password" name="password" required minlength="8"
                        class="w-full rounded-md border border-surface-border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ink-900"
                        placeholder="Mínimo 8 caracteres">
                </div>
                <button type="submit"
                    class="w-full rounded-md bg-ink-900 px-3 py-2.5 text-sm font-medium text-white hover:bg-ink-800 transition-colors">
                    Criar conta
                </button>
            </form>
        </div>
        <p class="mt-5 text-center text-sm text-ink-500">
            Já tem conta? <a href="/login" class="font-medium text-ink-900 underline">Entrar</a>
        </p>
    </div>
</div>
{% endblock %}
